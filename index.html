<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Pools by Garry Bair</title>
    <!-- Swiper CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 2rem;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        header p {
            font-size: 1.2rem;
        }
        #slideshow {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .swiper {
            width: 100%;
            height: 500px; /* Adjust height as needed */
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .swiper-pagination-bullet-active {
            background-color: #007bff;
        }
        .swiper-button-next, .swiper-button-prev {
            color: #007bff;
        }
        section#services {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            text-align: center;
        }
        section#services h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        section#services ul {
            list-style-type: none;
            padding: 0;
        }
        section#services li {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        footer {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 1rem;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Designer Pools</h1>
        <p>Your experts in custom swimming pool design and construction since 2004.</p>
    </header>

    <section id="slideshow">
        <div class="swiper">
            <div class="swiper-wrapper">
                <!-- Add your pool images here; replace src with your image paths -->
                <div class="swiper-slide"><img src="https://via.placeholder.com/1200x500?text=Pool+Project+1" alt="Custom Pool 1"></div>
                <div class="swiper-slide"><img src="https://via.placeholder.com/1200x500?text=Pool+Project+2" alt="Custom Pool 2"></div>
                <div class="swiper-slide"><img src="https://via.placeholder.com/1200x500?text=Pool+Project+3" alt="Custom Pool 3"></div>
                <div class="swiper-slide"><img src="https://via.placeholder.com/1200x500?text=Pool+Project+4" alt="Custom Pool 4"></div>
                <!-- Add more slides as needed -->
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </section>

    <section id="services">
        <h2>Our Services</h2>
        <ul>
            <li>Custom Pool Design</li>
            <li>Pool Installation and Construction</li>
            <li>Renovations and Repairs</li>
            <li>Landscaping Integration</li>
        </ul>
    </section>

    <footer>
        <p>Contact us: info@designerpoolskc.com | (123) 456-7890</p>
    </footer>

    <!-- Swiper JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- Custom JS for Swiper initialization -->
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true, // Enable infinite looping
            autoplay: {
                delay: 3000, // Auto-slide every 3 seconds
                disableOnInteraction: false // Continue autoplay after user interaction
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true // Allow clicking on pagination bullets
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev'
            },
            // Responsive breakpoints
            breakpoints: {
                640: {
                    slidesPerView: 1,
                    spaceBetween: 20
                },
                768: {
                    slidesPerView: 1,
                    spaceBetween: 30
                },
                1024: {
                    slidesPerView: 1,
                    spaceBetween: 40
                }
            }
        });
    </script>
</body>
</html>
