<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Version - Designer Pools by Garry Bair LLC</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #00aaff 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .version-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .version-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .version-info {
      font-size: 1.2rem;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    
    .timestamp {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border: 2px solid white;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    
    .back-link:hover {
      background: white;
      color: #0066cc;
    }
  </style>
</head>
<body>
  <div class="version-container">
    <div class="version-title">Designer Pools Website</div>
    <div class="version-info">Last Updated:</div>
    <div class="timestamp" id="lastUpdate">Loading...</div>
    <div class="version-info">Version: 1.0</div>
    <a href="/" class="back-link">← Back to Website</a>
  </div>

     <script>
     // Static timestamp - UPDATE THIS MANUALLY when you push code changes
     const lastUpdateTimestamp = 'September 1, 2025 at 1:00:00 PM CST';
     
     // Display the static timestamp
     document.getElementById('lastUpdate').textContent = lastUpdateTimestamp;
     
     // Also log to console for debugging
     console.log('Website last updated:', lastUpdateTimestamp);
   </script>
</body>
</html>
